# Lake configuration for the Lean proofs of Problem 131.
# Each paper is one library. Run `lake exe cache get` once, then `lake build`.
name = "Kagey131"
defaultTargets = ["PaperA", "PaperB", "PaperC", "PaperD", "PaperAD", "PaperF"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

# Paper A: paperA/problem131.tex (binary walk).
[[lean_lib]]
name = "PaperA"
srcDir = "."

# Paper B: paperB/problem131_multistate.tex (d-state walk).
[[lean_lib]]
name = "PaperB"
srcDir = "."

# Paper C: paperC/problem131_chains.tex (C1) and paperC2/problem131_reconstruction.tex (C2) (slowly switching chains, planar walk).
[[lean_lib]]
name = "PaperC"
srcDir = "."

# Paper D: paperD/problem131_memory.tex (walks with memory).
[[lean_lib]]
name = "PaperD"
srcDir = "."

# Paper A and Paper D together: Theorem 2.8 of Paper D (thm:erw-markov) with Paper A's
# Proposition 3.8. Imports modules of PaperA and PaperD (not their roots).
[[lean_lib]]
name = "PaperAD"
srcDir = "."

# Paper F: paperF/problem131_levy.tex (lattice Lévy walk, exact identities of Section 2).
[[lean_lib]]
name = "PaperF"
srcDir = "."
