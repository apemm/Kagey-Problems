# Lake configuration for the Lean proofs of Problem 131.
# Each paper is one library. Run `lake exe cache get` once, then `lake build`.
name = "Kagey131"
defaultTargets = ["PaperA", "PaperB", "PaperC", "PaperD"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

# Paper A: problem131.tex (binary walk).
[[lean_lib]]
name = "PaperA"
srcDir = "."

# Paper B: problem131_multistate.tex (d-state walk).
[[lean_lib]]
name = "PaperB"
srcDir = "."

# Paper C: paperC/problem131_switching.tex (slowly switching chains, planar walk).
[[lean_lib]]
name = "PaperC"
srcDir = "."

# Paper D: paperD/problem131_memory.tex (walks with memory).
[[lean_lib]]
name = "PaperD"
srcDir = "."
